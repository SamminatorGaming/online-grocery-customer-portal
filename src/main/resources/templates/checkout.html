<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Checkout</title>
    <link rel="stylesheet" href="/css/site.css">
</head>
<body>
<main class="wide-card">
    <div class="top-row">
        <div>
            <h1>Checkout</h1>
            <a href="/cart">Back to cart</a>
        </div>
    </div>

    <p class="error"  th:if="${error}"          th:text="${error}"></p>
    <p class="error"  th:if="${discountError}"   th:text="${discountError}"></p>
    <p class="success" th:if="${discountSuccess}" th:text="${discountSuccess}"></p>

    <section>
        <h2>Order summary</h2>
        <div class="cart-row" th:each="item : ${cart.items}">
            <div>
                <strong th:text="${item.product.name}"></strong>
                <span th:text="${' x' + item.quantity}"></span>
                <span th:text="${' — $' + #numbers.formatDecimal(item.calculateLineTotal(), 1, 2)}"></span>
            </div>
        </div>
        <p th:text="${'Subtotal: $' + #numbers.formatDecimal(subtotal, 1, 2)}"></p>
        <p th:if="${discount.compareTo(T(java.math.BigDecimal).ZERO) > 0}"
           th:text="${'Discount: -$' + #numbers.formatDecimal(discount, 1, 2)}"></p>
        <p th:text="${'Tax (8.25%): $' + #numbers.formatDecimal(tax, 1, 2)}"></p>
    </section>

    <section>
        <h2>Discount code</h2>
        <p th:if="${appliedCode != null}" th:text="${'Applied: ' + appliedCode}"></p>
        <form action="/checkout/apply-discount" method="post" class="inline-form">
            <input type="text" name="discountCode" placeholder="Enter code" th:value="${appliedCode}">
            <button type="submit">Apply</button>
        </form>
    </section>

    <form action="/checkout/place-order" method="post" id="place-order-form">

        <section>
            <h2>Delivery address</h2>
            <p th:if="${#lists.isEmpty(addresses)}">
                No addresses saved. <a href="/profile">Add one in your profile.</a>
            </p>
            <div th:each="addr : ${addresses}">
                <label>
                    <input type="radio" name="addressId" th:value="${addr.addressId}" required>
                    <span th:text="${addr.street + ', ' + addr.city + ', ' + addr.state + ' ' + addr.zipCode}"></span>
                </label>
            </div>
        </section>

        <section>
            <h2>Delivery option</h2>
            <div th:each="opt : ${deliveryOptions}">
                <label>
                    <input type="radio" name="deliveryOptionId" th:value="${opt.deliveryOptionId}" th:data-fee="${opt.fee}" onchange="updateTotal()" required>
                    <span th:text="${opt.type + ' — $' + #numbers.formatDecimal(opt.fee, 1, 2) + ' (' + opt.estimatedTime + ')'}"></span>
                </label>
            </div>
        </section>

        <h3 id="total-display" style="margin-top: 1.5rem; margin-bottom: 1rem;">Total: Select delivery option</h3>
        <button type="submit">Place order</button>
    </form>
    
    <script th:inline="javascript">
        function updateTotal() {
            var subtotal = /*[[${subtotal}]]*/ 0;
            var discount = /*[[${discount}]]*/ 0;
            var tax = /*[[${tax}]]*/ 0;
            var baseTotal = subtotal - discount + tax;
            
            var selectedRadio = document.querySelector('input[name="deliveryOptionId"]:checked');
            if (selectedRadio) {
                var fee = parseFloat(selectedRadio.getAttribute('data-fee'));
                var total = baseTotal + fee;
                document.getElementById('total-display').innerText = 'Total: $' + total.toFixed(2);
            }
        }
        
        // Run once on load in case a radio is pre-selected by browser history
        window.addEventListener('DOMContentLoaded', updateTotal);
    </script>
</main>
</body>
</html>
